name: ci-smoke-test

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch: {}

jobs:
  smoke:
    if: ${{ secrets.SMOKE_API_URL != '' }}
    runs-on: ubuntu-latest
    env:
      SMOKE_API_URL: ${{ secrets.SMOKE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run smoke test
        run: node ./scripts/smoke-test.js
        env:
          SMOKE_API_URL: ${{ secrets.SMOKE_API_URL }}
